## Job config for a Galaxy instance listening on 0.0.0.0:2718. ##

runners:
  local:
    load: galaxy.jobs.runners.local:LocalJobRunner
    workers: 4

# Uncomment if dynamic handlers are defined in "gravity:handlers" in galaxy.yml.
#
#handling:
#  assign:
#    - db-skip-locked

execution:
  default: docker_dispatch
  environments:
    local:
      runner: local

    esmfold_local:
      runner: local
      env:
        - name: ESMFOLD_ENV_NAME
          value: esmfold_official
        - name: ESMFOLD_BINARY
          value: /data/conda_envs/esmfold_official/bin/esm-fold
        - name: ESMFOLD_PYTHON
          value: /data/conda_envs/esmfold_official/bin/python
        - name: TORCH_HOME
          value: /data/cache/torch
      # Fallback for environments that expose the fair-esm Python API but do
      # not ship the `esm-fold` console entrypoint:
      # env:
      #   - name: ESMFOLD_PYTHON
      #     value: /data/conda_envs/esmfold_official/bin/python

    blast_local:
      runner: local
      env:
        - name: MAKEBLASTDB_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/makeblastdb
        - name: BLASTN_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/blastn
        - name: BLASTP_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/blastp

    foundry_local:
      runner: local
      env:
        - name: FOUNDRY_ENV_NAME
          value: foundry
        - name: RFD3_BINARY
          value: /data/conda_envs/foundry/bin/rfd3
        - name: MPNN_BINARY
          value: /data/conda_envs/foundry/bin/mpnn
        - name: FOUNDRY_CHECKPOINT_DIRS
          value: /data/models/foundry/checkpoints
        - name: TORCH_HOME
          value: /data/cache/torch

    foldx_local:
      runner: local
      env:
        - name: FOLDX_BINARY
          value: /data/tools/foldx/foldx

    protein_analysis_local:
      runner: local
      env:
        # Optional: configure this after installing the official local
        # Protein-Sol package. The template may use {input_fasta} and
        # {output_dir} placeholders.
        - name: PROTEINSOL_COMMAND
          value: /data/tools/protein-sol/run_protein_sol.sh {input_fasta} {output_dir}

    hotspot_wizard_local:
      runner: local
      env:
        # Shared environment for the HotSpot Wizard-like semi-rational protein
        # engineering workflow. Tool 2 uses DSSP/mkdssp; later steps can reuse
        # this env for FreeSASA, MAFFT/MUSCLE, CD-HIT/MMseqs2, and pocket tools.
        - name: PATH
          value: /data/conda_envs/hotspot_wizard/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: HOTSPOT_WIZARD_PYTHON
          value: /data/conda_envs/hotspot_wizard/bin/python
        - name: DSSP_BINARY
          value: /data/conda_envs/hotspot_wizard/bin/mkdssp
        - name: MKDSSP_BINARY
          value: /data/conda_envs/hotspot_wizard/bin/mkdssp
        - name: FREESASA_BINARY
          value: /data/conda_envs/hotspot_wizard/bin/freesasa

    promoter_design_local:
      runner: local
      env:
        # Install MEME Suite/FIMO and Promoter Calculator into this conda
        # environment. The fixed PATH avoids relying on shell startup files.
        - name: PATH
          value: /data/conda_envs/promoter_tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: PROMOTER_TOOLS_PYTHON
          value: /data/conda_envs/promoter_tools/bin/python
        # The Promoter Calculator wrapper expects this command to write a TSV
        # containing either `sequence_id,predicted_strength` columns or common
        # aliases such as `id,strength`.
        - name: PROMOTER_CALCULATOR_COMMAND
          value: /data/conda_envs/promoter_tools/bin/promoter-calculator -i {input_fasta} -o {output_tsv} --threads {threads}

    docker_local:
      runner: local
      docker_enabled: true
      #docker_volumes: $defaults,/mnt/galaxyData/libraries:ro,/mnt/galaxyData/indices:ro
      #docker_volumes_from: parent_container_name
      #docker_memory: 24G
      #docker_sudo: false
      #docker_sudo_cmd: /usr/bin/sudo -extra_param
      #docker_net: bridge
      #docker_auto_rm: true
      #docker_set_user: $UID
      docker_set_user:

      # This repository currently uses galaxy_infrastructure_url:
      #   http://${HOST_IP}:2718
      # for a no-hardcoded-IP default. If Docker-backed Interactive Tools
      # cannot call back to that address from containers on your host, switch
      # galaxy_infrastructure_url in config/galaxy.yml to a DNS name or host
      # alias the containers can resolve and uncomment the matching add-host
      # line here.
      #
      # Example pair:
      #   galaxy_infrastructure_url: http://galaxy.local:2718
      #   docker_run_extra_arguments: --add-host galaxy.local:host-gateway
      #
      # Example for Docker Desktop:
      #   galaxy_infrastructure_url: http://host.docker.internal:2718
      #   docker_run_extra_arguments: --add-host host.docker.internal:host-gateway
      #
      #docker_run_extra_arguments: --add-host galaxy.local:host-gateway

      #docker_cmd: /usr/local/custom_docker/docker
      #docker_host:
      #docker_container_id_override: busybox:1.36.1-glibc
      #docker_default_container_id: busybox:1.36.1-glibc
      #require_container: true
      #container_monitor: true
      #container_monitor_result: file
      #container_monitor_command: python /path/to/galaxy/lib/galaxy_ext/container_monitor/monitor.py
      #container_monitor_get_ip_method: null
      #container_resolvers_config_file: null
      #container_resolvers:

    docker_dispatch:
      runner: dynamic
      type: docker_dispatch
      docker_destination_id: docker_local
      default_destination_id: local

    # Example production destination for a containerized GPU-backed ESMFold
    # deployment. Uncomment, set a real image, and then switch the esmfold
    # tool mapping below from esmfold_local to esmfold_gpu.
    #
    #esmfold_gpu:
    #  runner: local
    #  docker_enabled: true
    #  docker_default_container_id: your-registry/esmfold:latest
    #  docker_run_extra_arguments: --gpus all

tools:
- id: esmfold
  environment: esmfold_local
- id: esmfold_batch
  environment: esmfold_local
- id: blast_search
  environment: blast_local
- id: protparam
  environment: protein_analysis_local
- id: protein_sol
  environment: protein_analysis_local
- id: foldx_stability
  environment: foldx_local
- id: foldx_buildmodel
  environment: foldx_local
- id: rfd3_design
  environment: foundry_local
- id: foundry_mpnn
  environment: foundry_local
- id: structure_quality_annotator
  environment: hotspot_wizard_local
- id: promoter_window_normalizer
  environment: promoter_design_local
- id: promoter_motif_scanner
  environment: promoter_design_local
- id: promoter_motif_pair_score
  environment: promoter_design_local
- id: promoter_random_mutagenesis
  environment: promoter_design_local
- id: promoter_strength_predictor
  environment: promoter_design_local
- id: promoter_variant_ranker
  environment: promoter_design_local
