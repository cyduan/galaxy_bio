## Job config for a Galaxy instance listening on 0.0.0.0:2718. ##

runners:
  local:
    load: galaxy.jobs.runners.local:LocalJobRunner
    workers: 4

# Uncomment if dynamic handlers are defined in "gravity:handlers" in galaxy.yml.
#
#handling:
#  assign:
#    - db-skip-locked

execution:
  default: docker_dispatch
  environments:
    local:
      runner: local

    esmfold_local:
      runner: local
      env:
        - name: ESMFOLD_ENV_NAME
          value: esmfold_official
        - name: ESMFOLD_BINARY
          value: /data/conda_envs/esmfold_official/bin/esm-fold
        - name: ESMFOLD_PYTHON
          value: /data/conda_envs/esmfold_official/bin/python
        - name: TORCH_HOME
          value: /data/cache/torch
      # Fallback for environments that expose the fair-esm Python API but do
      # not ship the `esm-fold` console entrypoint:
      # env:
      #   - name: ESMFOLD_PYTHON
      #     value: /data/conda_envs/esmfold_official/bin/python

    blast_local:
      runner: local
      env:
        - name: MAKEBLASTDB_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/makeblastdb
        - name: BLASTN_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/blastn
        - name: BLASTP_BINARY
          value: /home/ubuntu/miniconda3/envs/blastenv/bin/blastp

    docker_local:
      runner: local
      docker_enabled: true
      #docker_volumes: $defaults,/mnt/galaxyData/libraries:ro,/mnt/galaxyData/indices:ro
      #docker_volumes_from: parent_container_name
      #docker_memory: 24G
      #docker_sudo: false
      #docker_sudo_cmd: /usr/bin/sudo -extra_param
      #docker_net: bridge
      #docker_auto_rm: true
      #docker_set_user: $UID
      docker_set_user:

      # This repository currently uses galaxy_infrastructure_url:
      #   http://${HOST_IP}:2718
      # for a no-hardcoded-IP default. If Docker-backed Interactive Tools
      # cannot call back to that address from containers on your host, switch
      # galaxy_infrastructure_url in config/galaxy.yml to a DNS name or host
      # alias the containers can resolve and uncomment the matching add-host
      # line here.
      #
      # Example pair:
      #   galaxy_infrastructure_url: http://galaxy.local:2718
      #   docker_run_extra_arguments: --add-host galaxy.local:host-gateway
      #
      # Example for Docker Desktop:
      #   galaxy_infrastructure_url: http://host.docker.internal:2718
      #   docker_run_extra_arguments: --add-host host.docker.internal:host-gateway
      #
      #docker_run_extra_arguments: --add-host galaxy.local:host-gateway

      #docker_cmd: /usr/local/custom_docker/docker
      #docker_host:
      #docker_container_id_override: busybox:1.36.1-glibc
      #docker_default_container_id: busybox:1.36.1-glibc
      #require_container: true
      #container_monitor: true
      #container_monitor_result: file
      #container_monitor_command: python /path/to/galaxy/lib/galaxy_ext/container_monitor/monitor.py
      #container_monitor_get_ip_method: null
      #container_resolvers_config_file: null
      #container_resolvers:

    docker_dispatch:
      runner: dynamic
      type: docker_dispatch
      docker_destination_id: docker_local
      default_destination_id: local

    # Example production destination for a containerized GPU-backed ESMFold
    # deployment. Uncomment, set a real image, and then switch the esmfold
    # tool mapping below from esmfold_local to esmfold_gpu.
    #
    #esmfold_gpu:
    #  runner: local
    #  docker_enabled: true
    #  docker_default_container_id: your-registry/esmfold:latest
    #  docker_run_extra_arguments: --gpus all

tools:
- id: esmfold
  environment: esmfold_local
- id: blast_search
  environment: blast_local
