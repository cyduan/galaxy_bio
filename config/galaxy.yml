gravity:
  gunicorn:
    bind: 0.0.0.0:2718

  gx_it_proxy:
    enable: true
    port: 4002

galaxy:
  job_config_file: job_conf.yml

  tool_config_file:
    - ../lib/galaxy/config/sample/tool_conf.xml.sample
    - tool_conf.interactivetools.xml
    - tool_conf.structure_prediction.xml

  interactivetools_enable: true
  interactivetools_map: database/interactivetools_map.sqlite
  outputs_to_working_directory: true

  # Dynamic host IP keeps the repository free of hard-coded addresses. For a
  # stable public deployment, replace ${HOST_IP} with your DDNS name or FQDN.
  galaxy_infrastructure_url: http://${HOST_IP}:2718
  galaxy_infrastructure_web_port: 2718

  # Direct proxy mode keeps Interactive Tools working without an upstream
  # reverse proxy. For a more production-style setup behind nginx or Caddy,
  # switch this to true and route IT traffic through the proxy instead.
  interactivetools_upstream_proxy: false
  # Replace this hostname with the same public DNS/DDNS name that users will
  # use to reach Galaxy if you want Interactive Tools to work externally.
  interactivetools_proxy_host: galaxy.example.com:4002
